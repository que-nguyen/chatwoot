services:
  caddy:
    image: caddy:2-alpine
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${CW_CADDY_HTTP_PORT:-80}:80"
      - "${CW_CADDY_HTTPS_PORT:-443}:443"
    depends_on:
      rails:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 80"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
