services:
  caddy:
    image: caddy:2-alpine
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${CW_CADDY_HTTP_PORT:-80}:80"
      - "${CW_CADDY_HTTPS_PORT:-443}:443"
    depends_on:
      rails:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v wget >/dev/null 2>&1; then wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1; elif command -v nc >/dev/null 2>&1; then nc -z -w 2 127.0.0.1 80; else exit 1; fi"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
