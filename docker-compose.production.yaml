x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:${CW_IMAGE_TAG:-latest}
  env_file: ${CW_ENV_FILE:-.env} ## Change this file for customized env variables
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${CW_WEB_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test:
        [
          'CMD',
          'ruby',
          '-rsocket',
          '-e',
          'begin; Socket.tcp("127.0.0.1", 3000, connect_timeout: 2) { |s| }; rescue StandardError; exit 1; end'
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  sidekiq:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    healthcheck:
      test: ['CMD-SHELL', "tr '\\0' ' ' < /proc/1/cmdline | grep -q sidekiq"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: always

  migrate:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:chatwoot_prepare']
    restart: 'no'

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:${CW_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "test -n \"$${REDIS_PASSWORD}\" || (echo 'REDIS_PASSWORD is required' && exit 1); redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    env_file: ${CW_ENV_FILE:-.env}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${CW_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  storage_data:
  postgres_data:
  redis_data:
